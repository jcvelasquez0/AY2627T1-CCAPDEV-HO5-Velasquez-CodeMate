<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peer Tutoring Analytics Dashboard</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container py-4 py-lg-5">
    <header class="mb-4 text-center text-lg-start">
      <h1 class="h3 fw-bold text-dark mb-1">CodeMate Course Analytics</h1>
      <p class="text-secondary small mb-0">Tutoring demand, topic bottlenecks, and tutor skill metrics</p>
    </header>

    <div class="row g-4">
      <div class="col-12 col-lg-4">
        <div class="card h-100 shadow-sm border-0 dashboard-card">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title h6 fw-bold text-dark mb-1">Active Requests by Course</h5>
            <p class="card-subtitle small text-muted mb-3">Demand share across enrolled core subjects</p>
            <div class="chart-wrapper flex-grow-1">
              <canvas id="courseDoughnutChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card h-100 shadow-sm border-0 dashboard-card">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title h6 fw-bold text-dark mb-1">Top Problem Areas</h5>
            <p class="card-subtitle small text-muted mb-3">Frequency of booked help topics</p>
            <div class="chart-wrapper flex-grow-1">
              <canvas id="topicPolarChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card h-100 shadow-sm border-0 dashboard-card">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title h6 fw-bold text-dark mb-1">Tutor Competency Benchmark</h5>
            <p class="card-subtitle small text-muted mb-3"> Score vs. department average</p>
            <div class="chart-wrapper flex-grow-1">
              <canvas id="competencyRadarChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
